<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LIR Snake Arcade — Pure LIR Web GUI</title>
  <style>
    :root {
      --bg: #0a0e17;
      --card: #131b2e;
      --border: #233152;
      --accent-green: #10b981;
      --neon-green: #34d399;
      --accent-red: #ef4444;
      --neon-cyan: #06b6d4;
      --neon-yellow: #fbbf24;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(6, 182, 212, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header Window Bar */
    .arcade-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.1);
      backdrop-filter: blur(8px);
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .window-dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot.red { background: #ef4444; box-shadow: 0 0 8px #ef444488; }
    .dot.yellow { background: #fbbf24; box-shadow: 0 0 8px #fbbf2488; }
    .dot.green { background: #10b981; box-shadow: 0 0 8px #10b98188; }

    .title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--neon-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Scoreboard */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }

    .score-item {
      background: rgba(10, 14, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 8px 4px;
    }

    .score-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .score-val {
      font-size: 1.25rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .score-val.highlight {
      color: var(--neon-yellow);
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
    }
    .score-val.green {
      color: var(--neon-green);
      text-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
    }

    /* Canvas Screen */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      background: #060911;
      border: 2px solid var(--border);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(6, 182, 212, 0.15);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* CRT Scanlines Overlay */
    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      opacity: 0.35;
    }

    /* Game Overlay (Start / Game Over / Pause) */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.2s ease;
    }
    .overlay.hidden {
      display: none;
    }

    .overlay-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
    }
    .overlay-title.over {
      color: var(--accent-red);
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    }
    .overlay-title.start {
      color: var(--neon-cyan);
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
    }

    .overlay-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      max-width: 80%;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-green), var(--neon-cyan));
      color: #060911;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }
    .btn:active {
      transform: translateY(0);
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .speed-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s;
    }
    .speed-btn.active {
      background: rgba(6, 182, 212, 0.2);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    /* Mobile D-Pad */
    .dpad-card {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 50px);
      gap: 8px;
      margin: 4px auto 0 auto;
      justify-content: center;
    }

    .dpad-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.2rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      touch-action: manipulation;
    }
    .dpad-btn:active {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--neon-green);
      color: var(--neon-green);
    }
    .dpad-btn.up    { grid-column: 2; grid-row: 1; }
    .dpad-btn.left  { grid-column: 1; grid-row: 2; }
    .dpad-btn.pause { grid-column: 2; grid-row: 2; font-size: 0.8rem; font-weight: 700; }
    .dpad-btn.right { grid-column: 3; grid-row: 2; }
    .dpad-btn.down  { grid-column: 2; grid-row: 3; }

    /* Footer Info */
    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .footer a {
      color: var(--neon-cyan);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="arcade-card">
      <div class="header-bar">
        <div class="window-dots">
          <div class="dot red"></div>
          <div class="dot yellow"></div>
          <div class="dot green"></div>
        </div>
        <div class="title">
          <span>◆</span> LIR SNAKE ARCADE
        </div>
        <div class="badge">Pure LIR v2.2</div>
      </div>

      <div class="scoreboard">
        <div class="score-item">
          <div class="score-label">Skor</div>
          <div class="score-val green" id="score">0</div>
        </div>
        <div class="score-item">
          <div class="score-label">En Yüksek</div>
          <div class="score-val highlight" id="highScore">0</div>
        </div>
        <div class="score-item">
          <div class="score-label">Yılan Boyu</div>
          <div class="score-val" id="snakeLen">4</div>
        </div>
        <div class="score-item">
          <div class="score-label">Seviye</div>
          <div class="score-val" id="level">1</div>
        </div>
      </div>
    </div>

    <!-- Canvas Oyun Ekranı -->
    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="480" height="480"></canvas>
      <div class="scanlines"></div>

      <!-- Start / Game Over Overlay -->
      <div class="overlay" id="overlay">
        <div class="overlay-title start" id="overlayTitle">LIR SNAKE</div>
        <div class="overlay-sub" id="overlaySub">Yön tuşları veya W/A/S/D ile yılanı kontrol et, elmayı ye ve büyü!</div>
        <button class="btn" id="startBtn">
          <span>▶</span> OYUNA BAŞLA
        </button>
      </div>
    </div>

    <!-- Ayarlar ve Hız Kontrolü -->
    <div class="arcade-card" style="padding: 12px 16px;">
      <div class="controls-bar">
        <div>
          <span>Hız:</span>
          <button class="speed-btn" data-speed="100">Sakin</button>
          <button class="speed-btn active" data-speed="75">Klasik</button>
          <button class="speed-btn" data-speed="50">Hiper</button>
        </div>
        <div style="font-size: 0.75rem;">
          <kbd style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;">Space</kbd> Duraklat
        </div>
      </div>
    </div>

    <!-- Mobil Dokunmatik D-Pad -->
    <div class="dpad-card">
      <button class="dpad-btn up" id="btnUp">▲</button>
      <button class="dpad-btn left" id="btnLeft">◀</button>
      <button class="dpad-btn pause" id="btnPause">❚❚</button>
      <button class="dpad-btn right" id="btnRight">▶</button>
      <button class="dpad-btn down" id="btnDown">▼</button>
    </div>

    <div class="footer">
      %100 LIR Dili HTTP Sunucusu ile sunulmaktadır · <a href="/api/status" target="_blank">LIR API Durumu</a>
    </div>
  </div>

  <script>
    // ── Web Audio API Sentezleyici (Harici Ses Dosyası Gerekmez) ──────────────
    class SoundSynth {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playEat() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(780, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
      playTurn() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      }
      playOver() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(380, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.4);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    const sound = new SoundSynth();

    // ── Oyun Motoru ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySub = document.getElementById('overlaySub');
    const startBtn = document.getElementById('startBtn');

    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const snakeLenEl = document.getElementById('snakeLen');
    const levelEl = document.getElementById('level');

    const GRID_SIZE = 24;
    const CELL_SIZE = canvas.width / GRID_SIZE;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 12 };
    let score = 0;
    let highScore = parseInt(localStorage.getItem('lir_snake_high') || '0', 10);
    highScoreEl.textContent = highScore;

    let isRunning = false;
    let isPaused = false;
    let baseSpeed = 75;
    let particles = [];
    let gameLoopTimer = null;
    let foodPulse = 0;

    function reset() {
      const mid = Math.floor(GRID_SIZE / 2);
      snake = [
        { x: mid, y: mid },
        { x: mid - 1, y: mid },
        { x: mid - 2, y: mid },
        { x: mid - 3, y: mid }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      updateScoreboard();
      spawnFood();
      particles = [];
      isRunning = true;
      isPaused = false;
      overlay.classList.add('hidden');
    }

    function spawnFood() {
      let valid = false;
      let tries = 0;
      while (!valid && tries < 200) {
        const fx = Math.floor(Math.random() * (GRID_SIZE - 2)) + 1;
        const fy = Math.floor(Math.random() * (GRID_SIZE - 2)) + 1;
        const onSnake = snake.some(s => s.x === fx && s.y === fy);
        if (!onSnake) {
          food = { x: fx, y: fy };
          valid = true;
        }
        tries++;
      }
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1.5;
        particles.push({
          x: x * CELL_SIZE + CELL_SIZE / 2,
          y: y * CELL_SIZE + CELL_SIZE / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: color,
          alpha: 1,
          size: Math.random() * 4 + 2,
          life: 0.95
        });
      }
    }

    function update() {
      if (!isRunning || isPaused) return;

      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Duvar çarpışması
      if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
        gameOver();
        return;
      }

      // Kendine çarpma
      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Yem yeme
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        sound.playEat();
        createParticles(food.x, food.y, '#f87171');
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('lir_snake_high', highScore);
        }
        updateScoreboard();
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      isRunning = false;
      sound.playOver();
      overlayTitle.className = 'overlay-title over';
      overlayTitle.textContent = 'OYUN BİTTİ!';
      overlaySub.innerHTML = `Skorun: <strong style="color:var(--neon-green)">${score}</strong> · En Yüksek: <strong style="color:var(--neon-yellow)">${highScore}</strong>`;
      startBtn.innerHTML = '<span>↺</span> TEKRAR OYNA';
      overlay.classList.remove('hidden');
    }

    function updateScoreboard() {
      scoreEl.textContent = score;
      highScoreEl.textContent = highScore;
      snakeLenEl.textContent = snake.length;
      levelEl.textContent = Math.floor(score / 50) + 1;
    }

    // ── Çizim Döngüsü ────────────────────────────────────────────────────────
    function draw() {
      ctx.fillStyle = '#060911';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Arka plan ızgarası
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i < GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      // Parçacıklar
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha *= p.life;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        if (p.alpha < 0.05) particles.splice(i, 1);
      }

      // Yem (Elma - Parlayan daire ve halka)
      foodPulse += 0.08;
      const pulseScale = Math.sin(foodPulse) * 2;
      const fx = food.x * CELL_SIZE + CELL_SIZE / 2;
      const fy = food.y * CELL_SIZE + CELL_SIZE / 2;
      const fradius = CELL_SIZE / 2.5 + pulseScale;

      ctx.save();
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(fx, fy, Math.max(3, fradius), 0, Math.PI * 2);
      ctx.fill();

      // Yem iç parıltı
      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(fx - 2, fy - 2, Math.max(1, fradius / 3), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Yılan Gövdesi
      for (let i = snake.length - 1; i >= 0; i--) {
        const seg = snake[i];
        const isHead = (i === 0);
        const sx = seg.x * CELL_SIZE;
        const sy = seg.y * CELL_SIZE;

        ctx.save();
        if (isHead) {
          ctx.fillStyle = '#34d399';
          ctx.shadowColor = '#34d399';
          ctx.shadowBlur = 16;
          roundRect(ctx, sx + 2, sy + 2, CELL_SIZE - 4, CELL_SIZE - 4, 6);
          ctx.fill();

          // Gözler
          ctx.fillStyle = '#060911';
          const eyeOff = CELL_SIZE / 4;
          const eyeSize = 3;
          let e1 = { x: sx + eyeOff, y: sy + eyeOff };
          let e2 = { x: sx + CELL_SIZE - eyeOff, y: sy + eyeOff };

          if (dir.x === 1) {
            e1 = { x: sx + CELL_SIZE - eyeOff, y: sy + eyeOff };
            e2 = { x: sx + CELL_SIZE - eyeOff, y: sy + CELL_SIZE - eyeOff };
          } else if (dir.x === -1) {
            e1 = { x: sx + eyeOff, y: sy + eyeOff };
            e2 = { x: sx + eyeOff, y: sy + CELL_SIZE - eyeOff };
          } else if (dir.y === 1) {
            e1 = { x: sx + eyeOff, y: sy + CELL_SIZE - eyeOff };
            e2 = { x: sx + CELL_SIZE - eyeOff, y: sy + CELL_SIZE - eyeOff };
          }
          ctx.beginPath();
          ctx.arc(e1.x, e1.y, eyeSize, 0, Math.PI * 2);
          ctx.arc(e2.x, e2.y, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Gövde gradyanı
          const t = i / snake.length;
          const greenVal = Math.floor(185 - t * 60);
          ctx.fillStyle = `rgb(16, ${greenVal}, 129)`;
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 6;
          roundRect(ctx, sx + 2.5, sy + 2.5, CELL_SIZE - 5, CELL_SIZE - 5, 4);
          ctx.fill();
        }
        ctx.restore();
      }

      requestAnimationFrame(draw);
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    // ── Girdi Olayları ───────────────────────────────────────────────────────
    function changeDirection(dx, dy) {
      if (!isRunning) return;
      if (dx !== 0 && dir.x === -dx) return;
      if (dy !== 0 && dir.y === -dy) return;
      nextDir = { x: dx, y: dy };
      sound.playTurn();
    }

    window.addEventListener('keydown', (e) => {
      sound.init();
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          changeDirection(0, -1);
          e.preventDefault();
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          changeDirection(0, 1);
          e.preventDefault();
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          changeDirection(-1, 0);
          e.preventDefault();
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          changeDirection(1, 0);
          e.preventDefault();
          break;
        case ' ':
          if (isRunning) {
            isPaused = !isPaused;
            if (isPaused) {
              overlayTitle.className = 'overlay-title start';
              overlayTitle.textContent = 'DURAKLATILDI';
              overlaySub.textContent = 'Devam etmek için Boşluk veya Başlat butonuna bas';
              startBtn.innerHTML = '<span>▶</span> DEVAM ET';
              overlay.classList.remove('hidden');
            } else {
              overlay.classList.add('hidden');
            }
          } else {
            reset();
          }
          e.preventDefault();
          break;
      }
    });

    startBtn.addEventListener('click', () => {
      sound.init();
      if (isPaused) {
        isPaused = false;
        overlay.classList.add('hidden');
      } else {
        reset();
      }
    });

    document.getElementById('btnUp').addEventListener('click', () => { sound.init(); changeDirection(0, -1); });
    document.getElementById('btnDown').addEventListener('click', () => { sound.init(); changeDirection(0, 1); });
    document.getElementById('btnLeft').addEventListener('click', () => { sound.init(); changeDirection(-1, 0); });
    document.getElementById('btnRight').addEventListener('click', () => { sound.init(); changeDirection(1, 0); });
    document.getElementById('btnPause').addEventListener('click', () => {
      if (isRunning) {
        isPaused = !isPaused;
        if (isPaused) {
          overlayTitle.className = 'overlay-title start';
          overlayTitle.textContent = 'DURAKLATILDI';
          overlaySub.textContent = 'Devam etmek için Başlat butonuna dokun';
          startBtn.innerHTML = '<span>▶</span> DEVAM ET';
          overlay.classList.remove('hidden');
        } else {
          overlay.classList.add('hidden');
        }
      }
    });

    // Hız düğmeleri
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        baseSpeed = parseInt(e.target.dataset.speed, 10);
        restartLoop();
      });
    });

    function restartLoop() {
      if (gameLoopTimer) clearInterval(gameLoopTimer);
      gameLoopTimer = setInterval(update, baseSpeed);
    }

    restartLoop();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
